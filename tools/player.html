<!doctype html>
<!-- Live preview: serve the repo root (python3 -m http.server) and open http://localhost:8000/tools/player.html -->
<html><head><meta charset="utf-8"><title>figures player</title>
<style>
body{margin:0;background:#16110c;color:#e9dcc0;font:15px Georgia,serif;display:flex;flex-direction:column;align-items:center}
header{margin:22px 0 10px;letter-spacing:.3em;font-size:22px}
#stage{width:min(96vw,1100px);aspect-ratio:9/4;border-radius:8px;overflow:hidden;box-shadow:0 30px 60px -30px #000}
.bar{display:flex;gap:12px;align-items:center;margin:16px 0;width:min(96vw,1100px)}
button,select{background:#2a2219;color:#e9dcc0;border:1px solid #4a3d2c;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
input[type=range]{flex:1}
#t{width:70px;text-align:right;font-variant-numeric:tabular-nums}
#ttl{opacity:.7;margin-bottom:24px;text-align:center}
</style></head><body>
<header>FIGURES</header>
<div id="stage"></div>
<div class="bar"><button id="pp">Pause</button><input id="sc" type="range" min="0" max="1000" value="0"><span id="t">0.00 s</span>
<select id="sp"><option value="1">1×</option><option value=".5">0.5×</option><option value=".25">0.25×</option></select>
<select id="ex"><option>hello</option><option>mirror</option><option>court</option></select>
<button id="ld">Load JSON…</button><input id="fi" type="file" accept=".json" hidden></div>
<div id="ttl"></div>
<script src="../src/figures.js"></script>
<script>
let spec=null,T=0,D=10,play=true,last=performance.now(),speed=1;
const $=id=>document.getElementById(id);
function use(s){spec=s;D=s.duration||12;T=0;const st=$('stage');st.style.aspectRatio=(s.w||900)+'/'+(s.h||400);$('ttl').textContent=s.title||''}
async function load(name){use(await (await fetch('../examples/'+name+'.json')).json())}
function frame(now){if(spec){if(play){T+=(now-last)/1000*speed;if(T>D)T=0}
 $('stage').innerHTML=FIGURES.svg(spec,(spec.start||0)+T);$('sc').value=Math.round(T/D*1000);$('t').textContent=T.toFixed(2)+' s'}
 last=now;requestAnimationFrame(frame)}
$('pp').onclick=()=>{play=!play;$('pp').textContent=play?'Pause':'Play'};
$('sc').oninput=e=>{T=e.target.value/1000*D;play=false;$('pp').textContent='Play'};
$('sp').onchange=e=>speed=+e.target.value;$('ex').onchange=e=>load(e.target.value);
$('ld').onclick=()=>$('fi').click();$('fi').onchange=async e=>use(JSON.parse(await e.target.files[0].text()));
load('hello');requestAnimationFrame(frame);
</script></body></html>
